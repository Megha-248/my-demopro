<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edit Profile | E-Shop</title>
<style>
body {
    font-family: 'Poppins', sans-serif;
    background-color: #f4f6f7;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}
.container {
    background-color: white;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    width: 350px;
}
h2 {
    text-align: center;
    color: #2c3e50;
}
input, select {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    border-radius: 8px;
    border: 1px solid #bdc3c7;
    box-sizing: border-box;
}
button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    background-color: #27ae60;
    color: white;
    border: none;
    border-radius: 25px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}
button:hover {
    background-color: #1e8449;
}
</style>
</head>
<body>

<div class="container">
    <h2>Edit Profile</h2>
    <form id="editProfileForm">
        <input type="text" id="firstName" placeholder="First Name" required>
        <input type="text" id="lastName" placeholder="Last Name" required>
        <input type="text" id="address" placeholder="Address" required>
        <input type="text" id="phone" placeholder="Phone Number" required>
        <select id="gender" required>
            <option value="">Select Gender</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select>
        <input type="date" id="dob" placeholder="Date of Birth" required>
        <button type="submit">Save Profile</button>
    </form>
</div>

<script>
// Load saved profile if exists
const savedProfile = JSON.parse(localStorage.getItem("userProfile")) || {};
document.getElementById("firstName").value = savedProfile.firstName || "";
document.getElementById("lastName").value = savedProfile.lastName || "";
document.getElementById("address").value = savedProfile.address || "";
document.getElementById("phone").value = savedProfile.phone || "";
document.getElementById("gender").value = savedProfile.gender || "";
document.getElementById("dob").value = savedProfile.dob || "";

// Handle form submission
document.getElementById("editProfileForm").addEventListener("submit", function(e){
    e.preventDefault();
    const profile = {
        firstName: document.getElementById("firstName").value,
        lastName: document.getElementById("lastName").value,
        address: document.getElementById("address").value,
        phone: document.getElementById("phone").value,
        gender: document.getElementById("gender").value,
        dob: document.getElementById("dob").value
    };
    localStorage.setItem("userProfile", JSON.stringify(profile));
    alert("Profile saved successfully!");
});
</script>

</body>
</html>
